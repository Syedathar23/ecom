services:
  # ─── API Gateway ────────────────────────────────────
  gateway:
    build:
      context: ./services
      dockerfile: gateway/Dockerfile
    container_name: luxe_gateway
    ports:
      - "5000:5000"
    environment:
      - GATEWAY_PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - ORDER_SERVICE_URL=http://order-service:5003
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - luxe_network

  # ─── Auth Service ───────────────────────────────────
  auth-service:
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    container_name: luxe_auth
    ports:
      - "5001:5001"
    env_file:
      - ./services/auth/.env
    environment:
      - NODE_ENV=development
      - AUTH_PORT=5001
    networks:
      - luxe_network

  # ─── Product Service ────────────────────────────────
  product-service:
    build:
      context: ./services
      dockerfile: products/Dockerfile
    container_name: luxe_products
    ports:
      - "5002:5002"
    env_file:
      - ./services/products/.env
    environment:
      - NODE_ENV=development
      - PRODUCT_PORT=5002
    networks:
      - luxe_network

  # ─── Order Service ─────────────────────────────────
  order-service:
    build:
      context: ./services
      dockerfile: orders/Dockerfile
    container_name: luxe_orders
    ports:
      - "5003:5003"
    env_file:
      - ./services/orders/.env
    environment:
      - NODE_ENV=development
      - ORDER_PORT=5003
    networks:
      - luxe_network

  # ─── Frontend ──────────────────────────────────────
  frontend:
    image: node:18-alpine
    container_name: luxe_frontend_dev
    working_dir: /app
    volumes:
      - ./front:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - gateway
    networks:
      - luxe_network

networks:
  luxe_network:
    driver: bridge
